name: Fork build (unsigned)

# Fork-only: manually build unsigned desktop + CLI binaries for local install.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.repository != 'nesszer/Win-CodexBar'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop-tauri/package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: apps/desktop-tauri/pnpm-lock.yaml

      - name: Build desktop
        working-directory: apps/desktop-tauri
        run: |
          pnpm install --frozen-lockfile
          pnpm run tauri:build

      - name: Build CLI
        run: cargo build --release -p codexbar

      - name: Collect binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item target/release/codexbar-desktop-tauri.exe out/codexbar.exe
          Copy-Item target/release/codexbar.exe out/codexbar-cli.exe
          Get-ChildItem out | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: codexbar-fork-${{ github.sha }}
          path: out
          if-no-files-found: error
          retention-days: 14
